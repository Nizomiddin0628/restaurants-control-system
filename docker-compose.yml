# RestoPOS — lokal ishga tushirish: `docker compose up -d` → http://lazzat.localhost:8000
# Xizmatlar: db (PostgreSQL 16), redis, backend (Django), worker (Celery), minio (S3-mos fayl ombori, ixtiyoriy).
name: restopos

x-backend: &backend
  build:
    context: .
    dockerfile: infra/Dockerfile.backend
  env_file: .env
  environment:
    POSTGRES_HOST: db
    REDIS_URL: redis://redis:6379/0
  volumes:
    - ./backend:/app
    - media:/app/media
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_started }

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-restopos}
      POSTGRES_USER: ${POSTGRES_USER:-restopos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-restopos}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-restopos}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]
    ports: ["6379:6379"]

  backend:
    <<: *backend
    # birinchi ishga tushishda sxemalar, tariflar va demo restoran (lazzat.localhost) yaratiladi
    command: sh -c "python manage.py bootstrap_dev && python manage.py runserver 0.0.0.0:8000"
    ports: ["8000:8000"]

  worker:
    <<: *backend
    command: celery -A config worker -l info -Q critical,default,bulk --concurrency=2

  beat:
    <<: *backend
    command: celery -A config beat -l info

  # S3-mos fayl ombori (prod'da real S3 yoki MinIO). Ishlatish uchun .env'da AWS_* ni oching.
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]
    profiles: [storage]

  # Frontend dev-server (hot reload). Ishlatish: `docker compose --profile dev up` va .env'da VITE_DEV=1
  frontend:
    image: node:20-alpine
    working_dir: /work
    command: sh -c "corepack enable && pnpm install && pnpm --filter @restopos/admin dev --host"
    volumes: [./frontend:/work]
    ports: ["5173:5173"]
    profiles: [dev]

volumes:
  pgdata:
  redisdata:
  miniodata:
  media:
