# RestoPOS — prod reverse-proxy. Barcha subdomenlar (*.restopos.uz) bitta backendga boradi;
# tenant Host sarlavhasi bo'yicha aniqlanadi (django-tenants).
upstream restopos_backend { server backend:8000; keepalive 32; }

server {
    listen 80;
    server_name restopos.uz *.restopos.uz;
    client_max_body_size 25m;

    # yig'ilgan statik (whitenoise ham beradi, nginx tezroq)
    location /static/ { alias /app/staticfiles/; expires 30d; add_header Cache-Control "public, immutable"; }
    # media diskda bo'lsa (S3 bo'lsa bu blok kerak emas)
    location /media/  { alias /app/media/; expires 7d; }

    location / {
        proxy_pass http://restopos_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
# HTTPS: certbot --nginx -d restopos.uz -d '*.restopos.uz' (wildcard uchun DNS-01 tekshiruvi kerak)
